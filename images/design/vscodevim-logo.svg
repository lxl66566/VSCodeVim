<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" id="VSCodeVim_Fork_Badge" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566.9 566.9" xml:space="preserve">
<style type="text/css">
	.st0{fill:#FFFFFF;}
	.st1{fill:#208ECD;}
	.st2{opacity:0.3;fill:#FFFFFF;}
	.st3{fill:#D1D3D4;}
</style>

<!-- 底层白菱形 -->
<polygon id="white" class="st0" points="50.9,280.7 283.7,47.9 516.6,280.8 283.7,513.6 "/>

<!-- 主体 Vim “V” 纯平涂蓝色（完全保留原版色值） -->
<g id="Color_Diamond">
	<polygon class="st1" points="50.9,280.7 108.6,223 108.6,338.5 "/>
	<polygon class="st1" points="369.9,134.1 196.5,307.5 197.5,134.1 212,119.6 283.7,47.9 "/>
	<polygon class="st1" points="516.6,280.8 283.7,513.6 195.8,425.7 253.6,367.9 342.5,279.1 357,264.6 377.1,244.5 428.8,192.9 "/>
</g>

<!-- 高光折面 -->
<g id="Reflections">
	<polygon class="st2" points="283.7,220.3 196.5,307.5 197.5,134.1 "/>
	<polygon class="st2" points="430.3,366.8 341.3,455.7 253.6,367.9 342.5,279.1 "/>
	<rect x="250.9" y="91.7" transform="matrix(0.7071 -0.7071 0.7071 0.7071 -30.2983 232.2034)" class="st2" width="28.5" height="121.9"/>
	<polygon class="st2" points="464.8,332.2 444.7,352.4 357,264.6 377.1,244.5 "/>
</g>

<!-- 灰角切片 -->
<g id="Grey_tips">
	<polygon class="st3" points="108.6,338.5 195.8,425.7 108.6,512.8 "/>
	<polygon class="st3" points="108.6,134.1 197.5,134.1 108.6,223 "/>
	<polygon class="st3" points="487.3,134.1 443.2,178.5 428.8,192.9 369.9,134.1 "/>
</g>

<!-- 右下角极简方形角标：纯色深蓝底 + 纯白边框与几何“中”字 -->
<g id="Status_Badge">
	<rect x="345" y="345" width="125" height="125" rx="26" fill="#17699A" stroke="#FFFFFF" stroke-width="9"/>
	<!-- 几何“中” -->
	<rect x="375" y="388" width="65" height="38" rx="4" fill="none" stroke="#FFFFFF" stroke-width="10"/>
	<rect x="402.5" y="367" width="10" height="80" rx="3" fill="#FFFFFF"/>
</g>
</svg>